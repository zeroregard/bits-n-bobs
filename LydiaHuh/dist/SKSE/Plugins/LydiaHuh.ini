[General]
; Every this many seconds of unpaused play, roll TimerChance.
TimerIntervalSeconds=600
; Percent chance (0-100) that Lydia says "Huh?" when the timer fires.
TimerChance=50
; Percent chance (0-100) that Lydia says "Huh?" when she enters combat.
CombatChance=5
; Lydia must be within this distance of the player (in game units; ~70 units = 1 m).
MaxDistance=4000
; Sound file, relative to Data. Must be a PCM .wav (or .xwm) and exist when the game starts.
SoundPath=Sound\FX\LydiaHuh\huh.wav
; Volume 0-100.
Volume=100
; Show "Lydia: Huh?" in the top-left corner. 0 = off, 1 = on, 2 = only when the sound file is missing.
Notification=2
